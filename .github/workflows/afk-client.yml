# Builds the Projects Console Client (the AFK client of Projects Launcher) for every platform and
# packages it the way the launcher expects (crates/pl-afk, runtime.rs): one `<os>-<arch>.zip` per
# platform, with Projects-Konsol-Hesap(.exe) at the zip root next to its native libraries.
#
# - Push to `projects-ci`: build every platform, upload the zips plus SHA256SUMS and a dry-run
#   afk-release.json as workflow artifacts. Nothing is released.
# - Push of a version tag such as `1.4.0` (no "v" prefix) on a commit that contains this file:
#   the same build, then a GitHub release with the zips, SHA256SUMS and afk-release.json.
#   afk-release.json is the content index `afk` entry (see docs/content-format.md in the launcher
#   repo). Players only get a build after Projects Studio publishes it to the content index.
#   It also carries `minecraftVersions`, the AFK account version picker list, generated from MCC's
#   own protocol table by .github/scripts/minecraft_versions.py.
name: AFK client

on:
  push:
    # fix/auto-respond-regex: dry run of that branch only (no tag, no release). Leave this line out
    # when the fix moves to projects-ci.
    branches: [projects-ci, fix/auto-respond-regex]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: afk-client-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  EXE_NAME: Projects-Konsol-Hesap

jobs:
  build:
    name: ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, key: windows-x86_64 }
          - { os: windows-latest, rid: win-arm64, key: windows-aarch64 }
          - { os: ubuntu-latest, rid: linux-x64, key: linux-x86_64 }
          - { os: ubuntu-latest, rid: linux-arm64, key: linux-aarch64 }
          - { os: macos-latest, rid: osx-x64, key: macos-x86_64 }
          - { os: macos-latest, rid: osx-arm64, key: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # IncludeNativeLibrariesForSelfExtract=false and EnableCompressionInSingleFile=false come from
      # MinecraftClient.csproj (antivirus heuristics) and must not be overridden here.
      - name: Publish (self-contained, single file)
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish MinecraftClient/MinecraftClient.csproj -c Release -r "$RID" \
            --self-contained true -p:PublishSingleFile=true -p:UseAppHost=true \
            -p:DebugType=None -p:DebugSymbols=false -o out

      - name: Rename the executable
        run: |
          if [ -f out/MinecraftClient.exe ]; then
            mv out/MinecraftClient.exe "out/$EXE_NAME.exe"
          else
            mv out/MinecraftClient "out/$EXE_NAME"
            chmod 755 "out/$EXE_NAME"
          fi

      # Apple Silicon refuses unsigned code. The launcher also signs on install; this is a second line.
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          find out -name '*.dylib' -exec codesign --force --sign - {} +
          codesign --force --sign - "out/$EXE_NAME"
          find out -name '*.dylib' -exec codesign --verify {} +
          codesign --verify --verbose "out/$EXE_NAME"

      - name: Zip
        env:
          KEY: ${{ matrix.key }}
        run: |
          cd out
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip -mx=9 "../$KEY.zip" .
          else
            zip -X -r -9 "../$KEY.zip" .
          fi

      - name: Package summary
        env:
          KEY: ${{ matrix.key }}
        run: |
          if command -v sha256sum > /dev/null; then
            sha=$(sha256sum "$KEY.zip" | cut -d' ' -f1)
          else
            sha=$(shasum -a 256 "$KEY.zip" | cut -d' ' -f1)
          fi
          size=$(( $(wc -c < "$KEY.zip") ))
          echo "$KEY.zip size=$size sha256=$sha"
          ls -l out
          {
            echo "### $KEY.zip"
            echo
            echo "Size $size bytes, SHA-256 \`$sha\`"
            echo
            echo '```text'
            ls -l out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afk-${{ matrix.key }}
          path: ${{ matrix.key }}.zip
          if-no-files-found: error
          compression-level: 0

  # The versions MCC can join, grouped by protocol, newest first: [{value, label}]. The script fails
  # when ProtocolHandler.cs does not parse as expected, so the list is never empty or partial.
  versions:
    name: Minecraft versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.extract.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract the joinable Minecraft versions
        id: extract
        run: |
          python3 -I .github/scripts/minecraft_versions.py MinecraftClient minecraft-versions.json
          echo "json=$(jq -c . minecraft-versions.json)" >> "$GITHUB_OUTPUT"

  # Runs for branch pushes too: that is the dry run of the release files.
  manifest:
    name: Checksums and afk-release.json
    needs: [build, versions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: afk-*
          path: dist
          merge-multiple: true

      - name: Check the packages
        run: |
          python3 -I - dist <<'PY'
          import os
          import pathlib
          import sys
          import zipfile

          KEYS = ["windows-x86_64", "windows-aarch64", "linux-x86_64",
                  "linux-aarch64", "macos-x86_64", "macos-aarch64"]
          NATIVE_SUFFIXES = (".dll", ".so", ".dylib")

          dist = pathlib.Path(sys.argv[1])
          errors = []
          found = sorted(path.name for path in dist.glob("*.zip"))
          expected = sorted(f"{key}.zip" for key in KEYS)
          if found != expected:
              errors.append(f"expected {expected}, found {found}")

          lines = ["| Package | Files | Native libraries |", "| --- | --- | --- |"]
          for key in KEYS:
              path = dist / f"{key}.zip"
              if not path.is_file():
                  continue
              exe = "Projects-Konsol-Hesap" + (".exe" if key.startswith("windows-") else "")
              with zipfile.ZipFile(path) as archive:
                  broken = archive.testzip()
                  if broken:
                      errors.append(f"{key}: corrupt entry {broken}")
                  files = [info for info in archive.infolist() if not info.is_dir()]
              names = [info.filename for info in files]
              for name in names:
                  parts = name.split("/")
                  if name.startswith("/") or "\\" in name or "." in parts or ".." in parts:
                      errors.append(f"{key}: unsafe entry {name!r}")
              if exe not in names:
                  errors.append(f"{key}: {exe} is not at the zip root")
              elif not key.startswith("windows-"):
                  info = next(info for info in files if info.filename == exe)
                  mode = (info.external_attr >> 16) & 0o777
                  if not mode & 0o100:
                      errors.append(f"{key}: {exe} is not executable (mode {mode:o})")
              natives = [name for name in names if name.endswith(NATIVE_SUFFIXES)]
              nested = [name for name in natives if "/" in name]
              if nested:
                  errors.append(f"{key}: native libraries outside the zip root: {nested}")
              lines.append(f"| {key}.zip | {len(names)} | {', '.join(natives) or 'none'} |")

          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Packages\n\n" + "\n".join(lines) + "\n\n")
          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY

      - name: Checksums and afk-release.json
        env:
          MINECRAFT_VERSIONS: ${{ needs.versions.outputs.json }}
        run: |
          if ! printf '%s' "$MINECRAFT_VERSIONS" | jq -e 'type == "array" and length > 0
              and all(.[]; keys == ["label", "value"] and (.value | test("^[0-9]+(\\.[0-9]+)+$"))
                and (.label | type == "string"))' > /dev/null; then
            echo "::error::minecraftVersions from the versions job is missing or malformed."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            # Dry run: a placeholder version, so the URLs point at a release that does not exist.
            version="0.0.0-ci.$GITHUB_RUN_NUMBER"
          fi
          # Studio and the content tree accept [A-Za-z0-9._-] only (no "+"), at most 64 characters.
          if [ "${#version}" -gt 64 ] || ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z._-]*$'; then
            echo "::error::Unsupported version '$version': use x.y.z with an optional [0-9A-Za-z._-] suffix."
            exit 1
          fi
          cd dist
          sha256sum -- *.zip > SHA256SUMS
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$version"
          for zip in *.zip; do
            key="${zip%.zip}"
            jq -n --arg key "$key" --arg v "$version" --arg url "$base/$zip" \
              --arg sha "$(sha256sum -- "$zip" | cut -d' ' -f1)" --argjson size "$(stat -c %s -- "$zip")" \
              '{($key): {path: "afk/\($v)/\($key).zip", urls: [$url], sha256: $sha, size: $size}}'
          done | jq -S -s --arg v "$version" --argjson versions "$MINECRAFT_VERSIONS" \
            '{version: $v, builds: add, minecraftVersions: $versions}' > afk-release.json
          cat afk-release.json SHA256SUMS
          {
            echo "### afk-release.json ($version)"
            echo
            echo '```json'
            cat afk-release.json
            echo '```'
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: |
            dist/SHA256SUMS
            dist/afk-release.json
          if-no-files-found: error

  release:
    name: GitHub release
    needs: manifest
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Verify the checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # --verify-tag: release the pushed tag only, never create a new one.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$VERSION" dist/*.zip dist/SHA256SUMS dist/afk-release.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
            --title "Projects Konsol Hesap $VERSION" \
            --notes "AFK client $VERSION for Projects Launcher: one zip per platform, SHA256SUMS and afk-release.json (the content index \`afk\` entry)."
